<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <!-- Stylised 'S' as a bullish chart line -->
  <path
    d="M8 22 C8 22, 11 22, 13 18 C15 14, 12 14, 12 14 C12 14, 9 14, 11 10 C13 6, 16 6, 19 6"
    fill="none"
    stroke="#10b981"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrow tip indicating upward momentum -->
  <polyline
    points="17,4 20,6 17,8"
    fill="none"
    stroke="#10b981"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Subtle dot at chart start -->
  <circle cx="8" cy="22" r="1.5" fill="#10b981"/>
