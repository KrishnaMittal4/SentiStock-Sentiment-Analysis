services:
  - type: web
    name: sentistock-backend
    runtime: python
    rootDir: backend
    # Install CPU-only PyTorch first (saves ~2GB vs the full CUDA build),
    # then install the rest of the dependencies.
    buildCommand: >
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINNHUB_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: DATABASE_URL
        value: sqlite:///./sentistock.db
      - key: CORS_ORIGINS
        value: https://sentistock-sentiment-analysis.vercel.app,https://krishnamittal4.github.io,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500
      # distilbert is ~70 MB vs FinBERT's 440 MB — fits in Render's 512 MB free tier.
      # Labels map to POSITIVE/NEGATIVE which sentiment_service.py handles.
      - key: SENTIMENT_MODEL_NAME
        value: distilbert-base-uncased-finetuned-sst-2-english
      - key: QUOTE_CACHE_SECONDS
        value: 30
      - key: HISTORY_CACHE_SECONDS
        value: 3600
      - key: NEWS_CACHE_SECONDS
        value: 600
